<script>
  // Supabase Credentials
  const SUPABASE_URL = "https://icxqvchscgftkajsougv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ar-rblB9yYwvancKM9hgwg_dRiN_CVA";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let rawXrayData = [];

  // DICOM Viewer Zoom & Filter Variables
  let currentZoom = 1;
  let isInverted = false;

  window.onload = function() {
    const savedUser = JSON.parse(localStorage.getItem('sdh_user'));
    if (savedUser) {
      currentUser = savedUser;
      showPortal(savedUser);
    }
  };

  // १. लॉगिन फंक्शन
  async function login() {
    const mobile = document.getElementById('login-mobile').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if (!mobile || !password) { alert('कृपया मोबाईल नंबर आणि पासवर्ड टाका!'); return; }

    const { data, error } = await _supabase
      .from('hospital_staff')
      .select('*')
      .eq('mobile', mobile)
      .eq('password', password)
      .single();

    if (error || !data) {
      alert('मोबाईल नंबर किंवा पासवर्ड चुकीचा आहे!');
    } else {
      currentUser = data;
      localStorage.setItem('sdh_user', JSON.stringify(data));
      showPortal(data);
    }
  }

  // २. पोर्टल UI दाखवणे
  function showPortal(user) {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('user-bar').classList.remove('hidden');
    document.getElementById('user-info').innerText = `लॉगिन: ${user.name} (${user.role.toUpperCase()})`;
    
    document.getElementById('filter-section').classList.remove('hidden');
    document.getElementById('xray-section').classList.remove('hidden');

    if (user.role === 'admin') {
      document.getElementById('admin-section').classList.remove('hidden');
      document.getElementById('multi-delete-bar').classList.remove('hidden');
    }

    fetchXrays();
    setInterval(fetchXrays, 5000); // दर ५ सेकंदांनी ऑटो-रिफ्रेश
  }

  // ३. X-Ray डेटाबेस आणि चॅट डेटा लोड करणे
  async function fetchXrays() {
    const { data: xrays } = await _supabase.from('xray_records').select('*').order('created_at', { ascending: false });
    const { data: opinions } = await _supabase.from('xray_opinions').select('*').order('created_at', { ascending: true });

    if (xrays) {
      rawXrayData = xrays.map(x => ({
        ...x,
        comments: opinions ? opinions.filter(op => op.xray_id === x.id) : []
      }));
      filterXrays();
    }
  }

  // ४. सर्च आणि डेट फिल्टर लॉजिक
  function filterXrays() {
    const searchText = document.getElementById('search-input').value.toLowerCase();
    const filterValue = document.getElementById('date-filter').value;
    const now = new Date();

    let filtered = rawXrayData.filter(xray => {
      const matchText = (xray.patient_id || '').toLowerCase().includes(searchText) || 
                        (xray.ai_hint || '').toLowerCase().includes(searchText);

      const xrayDate = new Date(xray.created_at);
      const diffDays = (now - xrayDate) / (1000 * 60 * 60 * 24);

      let matchDate = true;
      if (filterValue === '1') matchDate = diffDays <= 1;
      else if (filterValue === '8') matchDate = diffDays <= 8;
      else if (filterValue === '60') matchDate = diffDays <= 60;
      else if (filterValue === 'critical') matchDate = xray.is_flagged === true;

      return matchText && matchDate;
    });

    renderXrayCards(filtered);
  }

  // ५. X-Ray कार्ड्स रेंडर करणे
  function renderXrayCards(xrays) {
    let html = '';
    xrays.forEach(xray => {
      const date = new Date(xray.created_at).toLocaleString('mr-IN');
      const isCritical = xray.is_flagged;
      
      let chatHtml = '';
      xray.comments.forEach(c => {
        chatHtml += `<div class="chat-msg"><b>${c.doctor_name}:</b> ${c.opinion_text}</div>`;
      });

      html += `
        <div class="xray-card ${isCritical ? 'critical-card' : ''}" id="card-${xray.id}">
          
          <div class="action-bar no-print">
            <div>
              ${currentUser.role === 'admin' ? `<input type="checkbox" class="xray-select-box" data-id="${xray.id}" data-url="${xray.image_url}"> ` : ''}
              ${isCritical ? '<span class="critical-tag">🚨 विशेष लक्ष देण्याची गरज</span>' : ''}
            </div>
            <div>
              <button class="btn-whatsapp" onclick="sendToPatient('${xray.patient_id}', '${xray.image_url}')">📲 रुग्णाला पाठवा</button>
              <button class="btn-warning" onclick="toggleFlag(${xray.id}, ${isCritical})">${isCritical ? '🚩 अनफ्लॅग' : '🚩 विशेष लक्ष'}</button>
              <button class="btn-print" onclick="printReport(${xray.id})">🖨️ प्रिंट</button>
            </div>
          </div>

          <h4>📋 रुग्ण / X-Ray ID: ${xray.patient_id}</h4>
          
          <div class="xray-img-container" onclick="openDicomViewer('${xray.image_url}')">
            <img src="${xray.image_url}" alt="X-Ray">
            <div class="zoom-hint">🔍 फुल-स्क्रीन HD मेडिकल व्ह्यूसाठी क्लिक करा</div>
          </div>

          <div class="ai-badge">🤖 ${xray.ai_hint}</div>
          <p style="font-size:11px; color:#666; margin-top:5px;">तारीख व वेळ: ${date}</p>

          <div class="chat-section">
            <h5 style="margin:0 0 6px 0; color:#003366;">💬 डॉक्टरांचे अभिप्राय / चर्चा:</h5>
            <div class="chat-box">${chatHtml || '<i style="color:#888; font-size:11px;">अजून कोणताही अभिप्राय दिलेला नाही.</i>'}</div>
            <div class="chat-input-group no-print">
              <input type="text" id="input-${xray.id}" placeholder="तुमचे मत / टिप्पणी लिहा...">
              <button class="btn-success" style="padding:6px 12px; font-size:12px;" onclick="sendOpinion(${xray.id})">पाठवा</button>
            </div>
          </div>
        </div>
      `;
    });
    document.getElementById('xray-list').innerHTML = html || '<p style="text-align:center; color:#777;">कोणतेही X-Ray आढळले नाहीत.</p>';
  }

  // ६. DICOM Viewer Functions
  function openDicomViewer(imageUrl) {
    document.getElementById('dicom-image').src = imageUrl;
    document.getElementById('dicom-modal').style.display = 'block';
    resetDicomView();
  }

  function closeDicomViewer() {
    document.getElementById('dicom-modal').style.display = 'none';
  }

  function adjustZoom(amount) {
    currentZoom = Math.max(0.5, Math.min(3.5, currentZoom + amount));
    applyFilters();
  }

  function toggleInvert() {
    isInverted = !isInverted;
    applyFilters();
  }

  function applyFilters() {
    const img = document.getElementById('dicom-image');
    const brightness = document.getElementById('bright-slider').value;
    const contrast = document.getElementById('contrast-slider').value;
    
    let filterStr = `brightness(${brightness}%) contrast(${contrast}%)`;
    if (isInverted) filterStr += ` invert(100%)`;
    
    img.style.filter = filterStr;
    img.style.transform = `scale(${currentZoom})`;
  }

  function resetDicomView() {
    currentZoom = 1;
    isInverted = false;
    document.getElementById('bright-slider').value = 100;
    document.getElementById('contrast-slider').value = 100;
    applyFilters();
  }

  // ७. WhatsApp वर X-Ray पाठवणे
  function sendToPatient(patientId, imageUrl) {
    let mobile = prompt("रुग्णाचा १० अंकी मोबाईल नंबर टाका:");
    if (!mobile) return;
    mobile = mobile.trim();
    if (mobile.length !== 10 || isNaN(mobile)) { alert("अचूक १० अंकी मोबाईल नंबर टाका!"); return; }

    let message = `🏥 *शासकीय उपजिल्हा रुग्णालय, धानोरा*\n\nनमस्ते, आपला डिजिटल X-Ray तयार आहे.\n📋 *रुग्ण ID:* ${patientId}\n🖼️ *X-Ray पाहण्यासाठी किंवा डाउनलोड करण्यासाठी क्लिक करा:*\n${imageUrl}\n\nकाळजी घ्या व डॉक्टरांच्या सल्ल्यानुसार औषधोपचार घ्या!`;
    window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`, '_blank');
  }

  // ८. जुने X-Ray ऑटो-डिलीट करणे
  async function deleteOlderThan(days) {
    if (!confirm(`तुम्ही नक्की मागील ${days} दिवसांपेक्षा जुने सर्व X-Ray क्लाऊड वरून डिलीट करू इच्छिता?`)) return;

    const cutoffDate = new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString();
    const { data: oldRecords } = await _supabase.from('xray_records').select('*').lt('created_at', cutoffDate);

    if (!oldRecords || oldRecords.length === 0) {
      alert(`${days} दिवसांपेक्षा जुना एकही X-Ray आढळला नाही.`);
      return;
    }

    const filesToDelete = oldRecords.map(r => `public/${r.image_url.substring(r.image_url.lastIndexOf('/') + 1)}`);
    const idsToDelete = oldRecords.map(r => r.id);

    await _supabase.storage.from('xrays').remove(filesToDelete);
    await _supabase.from('xray_records').delete().in('id', idsToDelete);

    alert(`${oldRecords.length} जुने X-Ray यशस्वीरीत्या डिलीट झाले!`);
    fetchXrays();
  }

  // ९. मल्टी-डिलीट Checkboxes Logic
  function toggleSelectAll(master) {
    document.querySelectorAll('.xray-select-box').forEach(cb => cb.checked = master.checked);
  }

  async function deleteSelectedXrays() {
    const selected = document.querySelectorAll('.xray-select-box:checked');
    if (selected.length === 0) { alert("कृपया डिलीट करायचे X-Ray सेलेक्ट करा!"); return; }

    if (!confirm(`तुम्ही नक्की ${selected.length} X-Ray डिलीट करू इच्छिता?`)) return;

    const ids = []; const files = [];
    selected.forEach(cb => {
      ids.push(cb.dataset.id);
      files.push(`public/${cb.dataset.url.substring(cb.dataset.url.lastIndexOf('/') + 1)}`);
    });

    await _supabase.storage.from('xrays').remove(files);
    await _supabase.from('xray_records').delete().in('id', ids);

    alert("निवडलेले X-Ray डिलीट झाले!");
    fetchXrays();
  }

  // १०. फ्लॅग टोगल
  async function toggleFlag(xrayId, currentStatus) {
    await _supabase.from('xray_records').update({ is_flagged: !currentStatus }).eq('id', xrayId);
    fetchXrays();
  }

  // ११. रिपोर्ट प्रिंट
  function printReport(xrayId) {
    const card = document.getElementById(`card-${xrayId}`);
    card.classList.add('print-area');
    window.print();
    card.classList.remove('print-area');
  }

  // १२. अभिप्राय सेव्ह करणे
  async function sendOpinion(xrayId) {
    const inputEl = document.getElementById(`input-${xrayId}`);
    const text = inputEl.value.trim();
    if (!text) return;

    await _supabase.from('xray_opinions').insert([{ xray_id: xrayId, doctor_name: currentUser.name, opinion_text: text }]);
    inputEl.value = '';
    fetchXrays();
  }

  // १३. नवीन डॉक्टर ॲड करणे
  async function addDoctor() {
    const name = document.getElementById('doc-name').value.trim();
    const mobile = document.getElementById('doc-mobile').value.trim();
    const password = document.getElementById('doc-password').value.trim();

    if (!name || !mobile || !password) { alert('सर्व माहिती भरा!'); return; }

    const { error } = await _supabase.from('hospital_staff').insert([{ name, mobile, password, role: 'doctor' }]);
    if (error) alert('हा मोबाईल नंबर आधीच रजिस्टर आहे किंवा काही त्रुटी आहे!');
    else {
      alert('डॉक्टर यशस्वीरीत्या ॲड झाले!');
      document.getElementById('doc-name').value = ''; 
      document.getElementById('doc-mobile').value = ''; 
      document.getElementById('doc-password').value = '';
    }
  }

  // १४. लॉग आऊट
  function logout() {
    localStorage.removeItem('sdh_user');
    location.reload();
  }
</script>
